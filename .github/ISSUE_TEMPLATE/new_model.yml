name: Support a new Skydimo model
description: My strip is detected as an "unknown model"
labels: [new model]
body:
  - type: input
    id: model
    attributes:
      label: Model string reported by `ambiluz --probe`
      placeholder: e.g. SK0127
    validations:
      required: true
  - type: input
    id: leds
    attributes:
      label: LEDs per side (left / top / right / bottom)
      description: Use Settings → Calibration → "LED-by-LED sweep" to count them.
      placeholder: e.g. 17 / 31 / 17 / 0
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Product name / monitor size / link
